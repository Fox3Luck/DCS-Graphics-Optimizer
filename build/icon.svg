<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- DCS Graphics Optimizer: a HUD gunsight with a rising frame-rate trace inside it.
       The app icon (a tile, so it stands out on any taskbar); icon-small.svg is the same
       mark without the sight's tick marks, for the 16 and 24 pixel sizes in icon.ico. -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="#111a16" stroke="#2d403a" stroke-width="2"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffb224" stroke-width="3.8"/>
  <path d="M32 6v7.5M32 50.5v7.5M6 32h7.5M50.5 32h7.5" stroke="#ffb224" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M22 38.5l7.5-7.5 5.5 4.5 9-11.5" fill="none" stroke="#3fd98b" stroke-width="5.6"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
